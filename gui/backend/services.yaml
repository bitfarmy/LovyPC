# LovyPC — Definizione servizi
# Aggiungi un servizio = aggiungi un blocco qui sotto
# Il nome del service systemd è costruito da pcwin_cmd:
#   "tramamind"     → pcwin-tramamind.service
#   "tramamind ui"  → pcwin-tramamind-ui.service

services:
  tramamind:
    name: TramaMind
    description: IA personale multi-modello
    icon: "🧵"
    tunnels:
      - name: omniroute
        display: OmniRoute
        port: 20128
        pcwin_cmd: tramamind
        url: http://localhost:20128/v1
      - name: openhands
        display: OpenHands
        port: 3000
        pcwin_cmd: "tramamind ui"
        url: http://localhost:3000

  ollama:
    name: Ollama
    description: Modelli locali (debug — usa solo se OmniRoute non risponde)
    icon: "🦙"
    tunnels:
      - name: main
        display: Ollama API
        port: 11434
        pcwin_cmd: ollama
        url: http://localhost:11434

